name: Build and Pack AI Visualizer

on:
  push:
    branches:
      - master # 如果你的默认分支叫 main，请改为 main

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取你的代码
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 设置云端 Node.js 环境
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: 'knn-classifier/demo/package.json'

    # 3. 🔴 强力清障：强制删除 demo 目录下和项目根目录的所有残存锁文件，防止引发 yarn 崩溃
    - name: Clean Up Old Lock Files
      run: |
        rm -f knn-classifier/demo/yarn.lock
        rm -f knn-classifier/demo/package-lock.json
        rm -f yarn.lock
        rm -f package-lock.json

    # 4. 在云端安装依赖，并主动追加安装 babel-preset-env，斩断后续自动触发漏洞
    - name: Install Dependencies
      run: |
        cd knn-classifier/demo
        npm install
        npm install babel-preset-env --no-save

    # 5. 🔴 终极修复打包：加入 --no-autoinstall 标志，强行锁死打包器行为，不允许后台自动下载包
    - name: Build Project
      run: |
        cd knn-classifier/demo
        npm run build -- --no-autoinstall

    # 6. 将打包好的离线 dist 静态文件夹发布为 ZIP 供你下载
    - name: Upload Packaged Artifact
      uses: actions/upload-artifact@v4
      with:
        name: teachable-machine-local-app
        path: knn-classifier/demo/dist/
        retention-days: 7
